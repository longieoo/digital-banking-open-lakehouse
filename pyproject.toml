[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-banking-open-lakehouse"
version = "0.1.0"
description = "Production-style educational banking data platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = ["psycopg[binary]==3.2.9", "boto3==1.38.46", "pyiceberg[pyarrow]==0.9.1", "azure-storage-blob==12.25.1", "azure-identity==1.23.0"]
dev = ["ruff==0.11.13", "PyYAML==6.0.2"]
streaming = ["confluent-kafka==2.10.0"]

[project.scripts]
bank = "bank.cli:main"

[tool.setuptools.packages.find]
include = ["bank*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
