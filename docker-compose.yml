name: digital-banking-open-lakehouse
services:
  postgres:
    image: postgres:16.9
    profiles:
    - core
    env_file: .env
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles:
    - lakehouse
    env_file: .env
    command: server /data --console-address :9001
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles:
    - lakehouse
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
    - -ec
    - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      >/dev/null; mc mb --ignore-existing local/raw local/warehouse
  catalog:
    image: apache/iceberg-rest-fixture:1.9.1
    profiles:
    - lakehouse
    env_file: .env
    environment:
      CATALOG_URI: jdbc:sqlite:/catalog/catalog.db
      CATALOG_WAREHOUSE: s3://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    ports:
    - 127.0.0.1:8181:8181
    volumes:
    - catalog-data:/catalog
    depends_on:
      buckets:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8181/v1/config
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  bank:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    profiles:
    - core
    env_file: .env
    volumes:
    - ./runtime:/opt/bank/runtime
    command:
    - manifests
  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    profiles:
    - processing
    env_file: .env
    volumes:
    - ./runtime:/opt/bank/runtime
    - spark-ivy:/opt/spark/.ivy2
    mem_limit: 4g
  trino:
    image: trinodb/trino:475
    profiles:
    - query
    env_file: .env
    ports:
    - 127.0.0.1:8080:8080
    volumes:
    - ./query/catalog:/etc/trino/catalog:ro
    healthcheck:
      test:
      - CMD
      - trino
      - --execute
      - SELECT 1
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 3g
  dbt:
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    profiles:
    - query
    env_file: .env
    volumes:
    - ./runtime/dbt-target:/opt/bank/dbt/target
    command:
    - build
    - --profiles-dir
    - .
  airflow-init:
    build: &id001
      context: .
      dockerfile: docker/airflow.Dockerfile
    profiles: &id002
    - orchestration
    env_file: .env
    volumes: &id003
    - airflow-data:/opt/airflow
    - ./runtime:/opt/bank/runtime
    mem_limit: 4g
    command:
    - bash
    - -ec
    - airflow db migrate && airflow users create --username "$${AIRFLOW_ADMIN_USER}"
      --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Demo --lastname Admin --role
      Admin --email demo@example.invalid
  airflow-scheduler:
    build: *id001
    profiles: *id002
    env_file: .env
    volumes: *id003
    mem_limit: 4g
    command:
    - scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - airflow jobs check --job-type SchedulerJob --local
      interval: 30s
      timeout: 15s
      retries: 10
  airflow-webserver:
    build: *id001
    profiles: *id002
    env_file: .env
    volumes: *id003
    mem_limit: 4g
    command:
    - webserver
    ports:
    - 127.0.0.1:8081:8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 10
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.3
    profiles:
    - streaming
    command:
    - redpanda
    - start
    - --overprovisioned
    - --smp
    - '1'
    - --memory
    - 512M
    - --reserve-memory
    - 0M
    - --node-id
    - '0'
    - --check=false
    - --kafka-addr
    - internal://0.0.0.0:9092
    - --advertise-kafka-addr
    - internal://redpanda:9092
    volumes:
    - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
      - CMD
      - rpk
      - cluster
      - health
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1g
volumes:
  postgres-data: null
  minio-data: null
  catalog-data: null
  spark-ivy: null
  airflow-data: null
  redpanda-data: null
