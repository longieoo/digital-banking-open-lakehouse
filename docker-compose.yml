name: digital-banking-open-lakehouse
services:
  postgres:
    image: postgres:16.9
    profiles: [core]
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
volumes:
  postgres-data:
