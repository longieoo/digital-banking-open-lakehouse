name: digital-banking-open-lakehouse
services:
  postgres:
    image: postgres:16.9
    profiles: [core]
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [lakehouse]
    env_file: .env
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [lakehouse]
    env_file: .env
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: /bin/sh
    command:
      - -ec
      - 'mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null; mc mb --ignore-existing local/raw local/warehouse'
  catalog:
    image: apache/iceberg-rest-fixture:1.9.1
    profiles: [lakehouse]
    env_file: .env
    environment:
      CATALOG_URI: jdbc:sqlite:/catalog/catalog.db
      CATALOG_WAREHOUSE: s3://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    ports: ["127.0.0.1:8181:8181"]
    volumes: ["catalog-data:/catalog"]
    depends_on:
      buckets: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8181/v1/config]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
  bank:
    build: {context: ., dockerfile: docker/python.Dockerfile}
    profiles: [core]
    env_file: .env
    volumes: ["./runtime:/opt/bank/runtime"]
    command: [manifests]
  spark:
    build: {context: ., dockerfile: docker/spark.Dockerfile}
    profiles: [processing]
    env_file: .env
    volumes: ["./runtime:/opt/bank/runtime", "spark-ivy:/opt/spark/.ivy2"]
    mem_limit: 4g
  trino:
    image: trinodb/trino:475
    profiles: [query]
    env_file: .env
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./query/catalog:/etc/trino/catalog:ro"]
    healthcheck:
      test: [CMD, trino, --execute, SELECT 1]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 3g
volumes:
  postgres-data:
  minio-data:
  catalog-data:
  spark-ivy:
