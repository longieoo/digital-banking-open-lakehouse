name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distributed:
        description: 'Run real release acceptance on the dedicated 16GB+ Docker runner'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-test.txt dbt-core==1.11.14 dbt-trino==1.9.3
      - run: ruff check .
      - run: python -m compileall -q bank processing streaming orchestration scripts tests
      - run: python -m unittest discover -s tests -v
      - run: dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      - run: python scripts/check_repository.py
      - run: cp .env.example .env && docker compose --profile '*' config --quiet
      - run: python -m pip wheel --no-deps --wheel-dir runtime/wheels .
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
  distributed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.distributed
    runs-on: [self-hosted, linux, bank-lakehouse]
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: bank-release-ci-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python scripts/create_demo_env.py
      # The demo runtime is owned by container UID 50000; this dedicated Docker
      # runner needs host permission to write evidence beside container artifacts.
      - run: sudo --preserve-env=COMPOSE_PROJECT_NAME,COMPOSE_FILE "$(command -v python)" -m scripts.release_acceptance
      - name: Start complete consumption and operating services
        run: sudo --preserve-env=COMPOSE_PROJECT_NAME,COMPOSE_FILE "$(command -v python)" -m scripts.platform up --project "$COMPOSE_PROJECT_NAME" --runtime runtime --internal --all --no-release
      - name: Verify reporting and operational HTTP readiness
        run: |
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=30); urllib.request.urlopen('http://127.0.0.1:9091/ready', timeout=30)"
      - name: Collect readable evidence without raw data or credentials
        if: always()
        run: |
          if [ -d runtime ]; then
            sudo find runtime -type f \( -name release-acceptance.json -o -path 'runtime/releases/*/release.json' -o -path 'runtime/releases/*/timings.json' \) -exec install -D -m 0644 {} ci-evidence/{} \;
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: ci-evidence/
      - run: docker compose --profile '*' stop
        if: always()
