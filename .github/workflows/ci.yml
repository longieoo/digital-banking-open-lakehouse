name: quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-test.txt dbt-core==1.11.14 dbt-trino==1.9.3
      - run: ruff check .
      - run: python -m compileall -q bank processing streaming orchestration scripts tests
      - run: python -m unittest discover -s tests -v
      - run: dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      - run: python scripts/check_repository.py
      - run: cp .env.example .env && docker compose --profile core --profile lakehouse --profile processing --profile query --profile streaming --profile orchestration config --quiet
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
