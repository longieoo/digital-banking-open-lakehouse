name: manual distributed acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-e2e:
    # A dedicated disposable runner with >=16 GB RAM and Docker is required.
    runs-on: [self-hosted, linux, bank-lakehouse]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate ephemeral local demo credentials
        run: python scripts/create_demo_env.py
      - run: python scripts/e2e.py
      - if: always()
        run: docker compose --profile core --profile lakehouse --profile query --profile processing down
